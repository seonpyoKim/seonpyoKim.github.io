<!-- Theme toggle. The button is hidden until this runs, so it never appears
     as a dead control when JavaScript is off. -->
<script>
(function(){
  var b=document.querySelector('.theme'),d=document.documentElement;
  if(!b)return;
  b.hidden=false;
  function sync(){b.setAttribute('aria-pressed',d.dataset.theme==='dark')}
  sync();
  b.addEventListener('click',function(){
    var next=d.dataset.theme==='dark'?'light':'dark';
    d.dataset.theme=next;d.style.colorScheme=next;
    try{localStorage.setItem('theme',next)}catch(e){}
    sync();
  });
})();
</script>
