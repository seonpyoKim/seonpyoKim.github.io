<!DOCTYPE html>

<meta name="color-scheme" content="light">
<!-- Restore the reader's saved theme before the stylesheet parses, so a
     dark-toggled visitor never sees a flash of light. Light is the default. -->
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light'){var d=document.documentElement;d.dataset.theme=t;d.style.colorScheme=t}}catch(e){}</script>

<!-- Theme toggle. The button is hidden until this runs, so it never appears
     as a dead control when JavaScript is off. -->
<script>
(function(){
  var b=document.querySelector('.theme'),d=document.documentElement;
  if(!b)return;
  b.hidden=false;
  function sync(){b.setAttribute('aria-pressed',d.dataset.theme==='dark')}
  sync();
  b.addEventListener('click',function(){
    var next=d.dataset.theme==='dark'?'light':'dark';
    d.dataset.theme=next;d.style.colorScheme=next;
    try{localStorage.setItem('theme',next)}catch(e){}
    sync();
  });
})();
</script>

</body>
